[project]
name = "smp-forecast"
version = "0.1.0"
description = "육지 시간별 SMP / 자사 발전기 이용률 전망 시스템"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",       # xlsx 읽기 (M-Core 수동 인계 파일)
    "requests>=2.32",
    "tenacity>=8.5",       # 수집기 재시도
    "python-dotenv>=1.0",
    "apscheduler>=3.10",   # cron 대체 스케줄러
    "streamlit>=1.38",     # 대시보드
    "plotly>=5.24",        # 대시보드 차트
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
